const K='karanlik-lonca-sifre';
const u=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open(pw){
  const bk=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u(D.s),iterations:D.n,hash:'SHA-256'},bk,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:u(D.i)},k,u(D.c));
  return new TextDecoder().decode(pt);
}
function show(html){document.open();document.write(html);document.close();}
async function tryOpen(pw,remember){
  try{const h=await open(pw);try{remember?localStorage.setItem(K,pw):localStorage.removeItem(K);}catch(e){}show(h);return true;}
  catch(e){return false;}
}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
(async()=>{let s=null;try{s=localStorage.getItem(K);}catch(e){}
  if(s&&await tryOpen(s,true))return;
  document.getElementById('f').onsubmit=async ev=>{ev.preventDefault();const b=document.getElementById('b');b.disabled=true;b.textContent='Açılıyor…';
    if(!await tryOpen(document.getElementById('p').value,document.getElementById('r').checked)){document.getElementById('e').textContent='Şifre yanlış.';b.disabled=false;b.textContent='Gir';}};
})();
